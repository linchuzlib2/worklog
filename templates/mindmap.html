{% extends 'base.html' %}
{% block title %}任务导图{% endblock %}
{% block content %}
<div class="mindmap-page">
<section class="page-heading"><div><p class="eyebrow">MIND MAP</p><h1>任务思维导图</h1><p class="subtitle">任务的创建与编辑都在这里完成，无限层级节点，可关联笔记和附件。</p></div><div class="top-actions"><form method="post" action="{{ url_for('mindmap_create_task') }}" class="inline-form"><input name="title" required placeholder="新任务节点名称"><input type="hidden" name="parent_id" value=""><button class="button primary">＋ 添加根节点</button></form></div></section>
<div class="mindmap-layout">
  <div class="map-canvas-wrap"><svg id="map-canvas"></svg></div>
  <aside class="map-panel" id="map-panel">
    <p class="muted map-panel-hint">点击左侧节点查看和编辑</p>
  </aside>
</div>
</div>
<script type="application/json" id="tree-data">{{ tree|tojson }}</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('tree-data').textContent);
  var NW = 168, NH = 40, HGAP = 72, VGAP = 12, PAD = 30;
  var root = { id: 0, title: '任务', root: true, status: 'root', notes: [], attachments: [], children: data };
  var svg = document.getElementById('map-canvas');
  var NS = 'http://www.w3.org/2000/svg';
  var selected = null;

  function measure(node) {
    if (!node.children || !node.children.length) { node.subH = NH; return; }
    var total = 0;
    node.children.forEach(function (c) { measure(c); total += c.subH; });
    total += VGAP * (node.children.length - 1);
    node.subH = Math.max(NH, total);
  }

  function assign(node, x, y) {
    node.x = x; node.y = y;
    if (!node.children || !node.children.length) return;
    var childX = x + NW + HGAP;
    var cursor = y - node.subH / 2;
    node.children.forEach(function (c) {
      var cy = cursor + c.subH / 2;
      assign(c, childX, cy);
      cursor += c.subH + VGAP;
    });
  }

  function el(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function nodeFill(node) {
    if (node.root) return '#263638';
    if (node.status === 'done') return '#e4ebe6';
    return { high: '#fde8df', medium: '#dcefe5', low: '#f2f4f1' }[node.priority] || '#dcefe5';
  }
  function nodeColor(node) {
    if (node.root) return '#fff';
    if (node.status === 'done') return '#9aa8a0';
    return { high: '#c65d4d', medium: '#238363', low: '#7d8786' }[node.priority] || '#238363';
  }

  function draw(node) {
    if (node.parent) {
      var x1 = node.parent.x + NW, y1 = node.parent.y;
      var x2 = node.x, y2 = node.y;
      var mx = (x1 + x2) / 2;
      svg.appendChild(el('path', { d: 'M' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2, fill: 'none', stroke: '#b8c6c0', 'stroke-width': 1.6 }));
    }
    var g = el('g', { class: 'map-node' + (node === selected ? ' selected' : ''), transform: 'translate(' + node.x + ',' + (node.y - NH / 2) + ')' });
    g.appendChild(el('rect', { width: NW, height: NH, rx: 9, fill: nodeFill(node), stroke: node === selected ? '#238363' : 'transparent', 'stroke-width': 2 }));
    var label = node.title.length > 10 ? node.title.slice(0, 10) + '…' : node.title;
    var t = el('text', { x: 12, y: NH / 2 + 5, fill: nodeColor(node), 'font-size': 13, 'font-weight': node.root ? 700 : 500 });
    t.textContent = label;
    g.appendChild(t);
    var badges = [];
    if (node.notes.length) badges.push('▤' + node.notes.length);
    if (node.attachments.length) badges.push('⌑' + node.attachments.length);
    if (node.children.length) badges.push('＋' + node.children.length);
    if (badges.length) g.appendChild(el('text', { x: NW - 8, y: NH / 2 + 4, fill: '#7d8786', 'font-size': 10, 'text-anchor': 'end' }, badges.join(' ')));
    g.addEventListener('click', function (ev) { ev.stopPropagation(); select(node); });
    svg.appendChild(g);
    (node.children || []).forEach(draw);
  }

  function findByTree(node, id) {
    if (node.id === id) return node;
    for (var i = 0; i < (node.children || []).length; i++) {
      var found = findByTree(node.children[i], id);
      if (found) return found;
    }
    return null;
  }

  // annotate tree with parent refs & findable notes/attachments from URL data
  (function annotate(node, parent) {
    node.parent = parent;
    (node.children || []).forEach(function (c) { annotate(c, node); });
  })(root, null);

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function select(node) {
    selected = node;
    render();
    var panel = document.getElementById('map-panel');
    if (node.root) {
      panel.innerHTML = '<h2>任务导图</h2><p class="muted">这是虚拟根节点。在右上角添加根任务，或点击任意节点进行编辑。</p>';
      return;
    }
    var linkedNoteIds = node.notes.map(function (n) { return n.id; });
    var linkedAttIds = node.attachments.map(function (a) { return a.id; });
    var noteOptions = window.__allNotes.filter(function (n) { return linkedNoteIds.indexOf(n.id) < 0; })
      .map(function (n) { return '<option value="' + n.id + '">' + esc(n.title) + '</option>'; }).join('');
    var attOptions = window.__allAttachments.filter(function (a) { return linkedAttIds.indexOf(a.id) < 0; })
      .map(function (a) { return '<option value="' + a.id + '">' + esc(a.name) + '</option>'; }).join('');
    var html = '';
    html += '<div class="panel-head"><span class="status-label ' + node.status + '">' + (node.status === 'done' ? '已完成' : (node.status === 'doing' ? '进行中' : '待处理')) + '</span><h2>' + esc(node.title) + '</h2></div>';
    html += '<a class="button ghost small" href="/tasks/' + node.id + '">打开任务详情 →</a>';
    html += '<form method="post" action="/tasks/' + node.id + '/status"><input type="hidden" name="status" value="' + (node.status === 'done' ? 'todo' : 'done') + '"><input type="hidden" name="next" value="/mindmap"><button class="button ghost small panel-btn">' + (node.status === 'done' ? '标记为待处理' : '标记为已完成') + '</button></form>';
    html += '<h3>编辑任务</h3>';
    html += '<form method="post" action="/mindmap/tasks/' + node.id + '/update" class="edit-form">';
    html += '<label>标题<input name="title" value="' + esc(node.title) + '" required></label>';
    html += '<label>状态<select name="status">' + ['todo', 'doing', 'done'].map(function (s) { return '<option value="' + s + '"' + (node.status === s ? ' selected' : '') + '>' + { todo: '待处理', doing: '进行中', done: '已完成' }[s] + '</option>'; }).join('') + '</select></label>';
    html += '<label>优先级<select name="priority">' + ['high', 'medium', 'low'].map(function (p) { return '<option value="' + p + '"' + (node.priority === p ? ' selected' : '') + '>' + { high: '高优先级', medium: '普通', low: '低优先级' }[p] + '</option>'; }).join('') + '</select></label>';
    html += '<label>截止日期<input type="date" name="due_date" value="' + esc(node.due_date || '') + '"></label>';
    html += '<label>描述<textarea name="description" rows="3" placeholder="任务描述...">' + esc((node.description || '').replace(/<[^>]+>/g, '')) + '</textarea></label>';
    html += '<button class="button primary small">保存修改</button></form>';
    html += '<h3>添加子节点</h3><form method="post" action="/mindmap/tasks/create" class="panel-form"><input type="hidden" name="parent_id" value="' + node.id + '"><input name="title" required placeholder="子节点名称"><button class="button primary small">添加</button></form>';
    html += '<h3>关联笔记 (' + node.notes.length + ')</h3>';
    node.notes.forEach(function (n) {
      html += '<div class="panel-item"><a href="/notes/' + n.id + '">▤ ' + esc(n.title) + '</a><form method="post" action="/mindmap/tasks/' + node.id + '/unlink"><input type="hidden" name="kind" value="note"><input type="hidden" name="item_id" value="' + n.id + '"><button class="icon-button" title="解除关联">✕</button></form></div>';
    });
    html += noteOptions ? '<form method="post" action="/mindmap/tasks/' + node.id + '/link" class="panel-form"><input type="hidden" name="kind" value="note"><select name="item_id">' + noteOptions + '</select><button class="button ghost small">关联</button></form>' : '<p class="muted small">没有更多可关联的笔记。</p>';
    html += '<h3>关联附件 (' + node.attachments.length + ')</h3>';
    node.attachments.forEach(function (a) {
      html += '<div class="panel-item"><a href="/attachments/' + a.id + '">⌑ ' + esc(a.name) + '</a><form method="post" action="/mindmap/tasks/' + node.id + '/unlink"><input type="hidden" name="kind" value="attachment"><input type="hidden" name="item_id" value="' + a.id + '"><button class="icon-button" title="解除关联">✕</button></form></div>';
    });
    html += attOptions ? '<form method="post" action="/mindmap/tasks/' + node.id + '/link" class="panel-form"><input type="hidden" name="kind" value="attachment"><select name="item_id">' + attOptions + '</select><button class="button ghost small">关联</button></form>' : '<p class="muted small">没有更多可关联的附件。</p>';
    html += '<h3>危险操作</h3><form method="post" action="/tasks/' + node.id + '/delete" onsubmit="return confirm(\'确定删除该节点及其所有子节点、笔记和附件吗？\')"><input type="hidden" name="next" value="/mindmap"><button class="button danger small">删除节点及子树</button></form>';
    panel.innerHTML = html;
    panel.scrollTop = 0;
  }

  function render() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    measure(root);
    assign(root, PAD, Math.max(root.subH / 2 + PAD, PAD));
    var width = 0, height = 0;
    (function bounds(node) {
      width = Math.max(width, node.x + NW);
      height = Math.max(height, node.y + NH / 2);
      (node.children || []).forEach(bounds);
    })(root);
    svg.setAttribute('width', width + PAD);
    svg.setAttribute('height', height + PAD);
    svg.style.height = Math.max(height + PAD, 320) + 'px';
    draw(root);
  }

  svg.addEventListener('click', function () { select(root); });
  render();
  select(root);
})();
</script>
<script>
window.__allNotes = [{% for note in notes %}{id: {{ note.id }}, title: {{ note.title|tojson }} }{{ ',' if not loop.last }}{% endfor %}];
window.__allAttachments = [{% for file in attachments %}{id: {{ file.id }}, name: {{ file.original_name|tojson }} }{{ ',' if not loop.last }}{% endfor %}];
</script>
{% endblock %}
