{% extends 'base.html' %}
{% block title %}任务导图{% endblock %}
{% block content %}
<div class="mindmap-page" id="mm-page">
<div class="mm-toolbar">
  <span class="mm-brand">◈ 任务导图</span>
  <span class="mm-sep"></span>
  <button class="mm-btn" data-mm-action="child" title="添加子节点 (Tab)">＋ 子节点</button>
  <button class="mm-btn" data-mm-action="sibling" title="添加同级节点 (Enter)">＋ 同级</button>
  <button class="mm-btn" data-mm-action="delete-node" title="删除当前节点（保留子节点）">－ 删节点</button>
  <button class="mm-btn" data-mm-action="delete-tree" title="删除节点及全部子节点">✕ 删子树</button>
  <span class="mm-sep"></span>
  <button class="mm-btn" data-mm-action="done" title="切换完成状态">✓ 完成</button>
  <span class="mm-flex"></span>
  <span class="mm-zoom-label" id="mm-zoom-label">100%</span>
  <button class="mm-btn" data-mm-action="zoom-out" title="缩小 (Ctrl -)">－</button>
  <button class="mm-btn" data-mm-action="zoom-in" title="放大 (Ctrl +)">＋</button>
  <button class="mm-btn" data-mm-action="zoom-fit" title="适应画布">最适合</button>
  <button class="mm-btn" data-mm-action="center" title="回到中心">⌂</button>
  <button class="mm-btn" data-mm-action="fullscreen" title="全屏 (F11 / Ctrl+Shift+F)">⛶ 全屏</button>
</div>
<div class="mindmap-layout mm-full">
  <div class="map-canvas-wrap" id="mm-canvas-wrap">
    <svg id="map-canvas"></svg>
    <div class="mm-hint">双击节点改标题 · 单击选中后在右侧编辑 · Tab 子节点 · Enter 同级 · Delete 删除 · 拖拽节点调层级 · 拖空白平移 · 滚轮缩放</div>
  </div>
  <aside class="map-panel mm-panel" id="map-panel">
    <p class="muted map-panel-hint">单击节点在此编辑一切：标题、状态、日期、笔记、附件。</p>
  </aside>
</div>
</div>
<script type="application/json" id="tree-data">{{ tree|tojson }}</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('tree-data').textContent);
  var NH = 42, HGAP = 76, VGAP = 14, PAD = 40, MAXW = 320;
  var root = { id: 0, title: '任务', root: true, status: 'root', priority: 'medium', due_date: '', description: '', notes: [], attachments: [], children: data };
  var wrap = document.getElementById('mm-canvas-wrap');
  var svg = document.getElementById('map-canvas');
  var panel = document.getElementById('map-panel');
  var NS = 'http://www.w3.org/2000/svg';
  var selected = null, editing = null;
  var view = { x: 0, y: 0, k: 1 };

  function textWidth(s) {
    var w = 0;
    for (var i = 0; i < s.length; i++) w += s.charCodeAt(i) > 255 ? 13 : 7.2;
    return w;
  }
  function nodeBadges(node) {
    var badges = [];
    if (node.notes.length) badges.push('▤' + node.notes.length);
    if (node.attachments.length) badges.push('⌑' + node.attachments.length);
    if (node.children.length) badges.push('＋' + node.children.length);
    return badges;
  }
  function nodeWidth(node) {
    var badges = nodeBadges(node);
    var bw = badges.length ? badges.join(' ').length * 6 + 16 : 0;
    return Math.min(MAXW, Math.max(64, Math.ceil(textWidth(node.title)) + 24 + bw + 10));
  }

  function measure(node) {
    node.w = nodeWidth(node);
    if (!node.children || !node.children.length) { node.subH = NH; return; }
    var total = 0;
    node.children.forEach(function (c, i) { c.ci = i; measure(c); total += c.subH; });
    total += VGAP * (node.children.length - 1);
    node.subH = Math.max(NH, total);
  }
  function assign(node, x, y) {
    node.x = x; node.y = y;
    if (!node.children || !node.children.length) return;
    var childX = x + node.w + HGAP;
    var cursor = y - node.subH / 2;
    node.children.forEach(function (c) {
      assign(c, childX, cursor + c.subH / 2);
      cursor += c.subH + VGAP;
    });
  }
  function el(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }
  var PALETTE = [
    { fill: '#dcefe5', text: '#238363' }, // green
    { fill: '#fde8df', text: '#c65d4d' }, // coral
    { fill: '#fdf3d7', text: '#a07818' }, // amber
    { fill: '#e3e8f7', text: '#4a5fb5' }, // blue
    { fill: '#f3e3f5', text: '#8a4f96' }, // purple
    { fill: '#e0f0f2', text: '#2a7f8f' }, // teal
    { fill: '#f7e5e8', text: '#b04a6a' }, // pink
    { fill: '#e8ecdf', text: '#6a7a3a' }  // olive
  ];
  function nodeFill(n) {
    if (n.root) return '#263638';
    if (n.status === 'done') return '#e4ebe6';
    return PALETTE[(n.ci || 0) % PALETTE.length].fill;
  }
  function nodeColor(n) {
    if (n.root) return '#fff';
    if (n.status === 'done') return '#9aa8a0';
    return PALETTE[(n.ci || 0) % PALETTE.length].text;
  }
  var PRIORITY_STROKE = { high: '#c65d4d', medium: '#238363', low: '#b8c6c0' };

  // ---- inline title edit (double click) ----
  function startEdit(node) {
    if (node.root || editing) return;
    editing = node;
    var fo = el('foreignObject', { x: node.x, y: node.y - NH / 2, width: node.w, height: NH });
    var input = document.createElement('input');
    input.value = node.title;
    input.className = 'mm-edit-input';
    fo.appendChild(input);
    svg.appendChild(fo);
    input.focus(); input.select();
    function commit(save) {
      if (!editing) return;
      var val = input.value.trim();
      editing = null;
      if (save && val) {
        fetch('/mindmap/tasks/' + node.id + '/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: val }) })
          .then(function () { node.title = val; render(); refreshPanel(); });
      } else { render(); }
    }
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); commit(true); }
      if (ev.key === 'Escape') { ev.preventDefault(); commit(false); }
    });
    input.addEventListener('blur', function () { commit(true); });
  }

  // ---- node drag to re-parent (delegated on wrap) ----
  var dragState = { dragging: null, moved: false, ghost: null, hoverEl: null };
  var panState = null;

  wrap.addEventListener('mousedown', function (ev) {
    if (ev.button !== 0 || editing) return;
    var g = ev.target.closest ? ev.target.closest('.map-node') : null;
    if (g && !g.__node.root) {
      dragState.dragging = g.__node; dragState.moved = false;
      dragState.startX = ev.clientX; dragState.startY = ev.clientY;
      ev.preventDefault();
    } else if (!g) {
      panState = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, moved: false };
      ev.preventDefault();
    }
  });

  var suppressClick = false;
  svg.addEventListener('click', function (ev) {
    if (suppressClick || dragState.moved) return;
    var g = ev.target.closest ? ev.target.closest('.map-node') : null;
    select(g ? g.__node : root);
  });
  svg.addEventListener('dblclick', function (ev) {
    var g = ev.target.closest ? ev.target.closest('.map-node') : null;
    if (g) startEdit(g.__node);
  });

  document.addEventListener('mousemove', function (ev) {
    if (!dragState.dragging) return;
    var dx = ev.clientX - dragState.startX, dy = ev.clientY - dragState.startY;
    if (!dragState.moved && Math.abs(dx) + Math.abs(dy) > 5) {
      dragState.moved = true;
      var n = dragState.dragging;
      dragState.ghost = el('rect', { width: node.w, height: NH, rx: 9, fill: 'rgba(35,131,99,.15)', stroke: '#238363', 'stroke-dasharray': '4 3', x: n.x + dx / view.k, y: n.y - NH / 2 + dy / view.k });
      svg.appendChild(dragState.ghost);
    }
    if (dragState.moved && dragState.ghost) {
      dragState.ghost.setAttribute('x', dragState.dragging.x + dx / view.k);
      dragState.ghost.setAttribute('y', dragState.dragging.y - NH / 2 + dy / view.k);
      clearDropHint();
      var target = nodeAt(dragState.dragging.x + dx / view.k, dragState.dragging.y + dy / view.k, dragState.dragging);
      if (target && target.__el) { dragState.hoverEl = target.__el; dragState.hoverEl.classList.add('drop-hint'); }
    }
  });

  function clearDropHint() {
    if (dragState.hoverEl) { dragState.hoverEl.classList.remove('drop-hint'); dragState.hoverEl = null; }
  }

  document.addEventListener('mouseup', function (ev) {
    if (!dragState.dragging) return;
    var node = dragState.dragging;
    var dx = ev.clientX - dragState.startX, dy = ev.clientY - dragState.startY;
    var moved = dragState.moved;
    if (dragState.ghost) { svg.removeChild(dragState.ghost); dragState.ghost = null; }
    clearDropHint();
    dragState.dragging = null;
    if (moved) {
      var target = nodeAt(node.x + dx / view.k, node.y + dy / view.k, node);
      if (target && target !== node) {
        fetch('/mindmap/tasks/' + node.id + '/move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ parent_id: target.id }) })
          .then(function (r) { return r.json(); }).then(function (res) { if (res.error) mmAlert(res.error); reloadTree(node.id); });
        return;
      }
      render();
    }
  });

  function nodeAt(x, y, exclude) {
    var found = null;
    (function walk(n) {
      if (n !== exclude && !n.root) {
        if (x >= n.x && x <= n.x + n.w && y >= n.y - NH / 2 && y <= n.y + NH / 2) { found = n; return; }
      }
      (n.children || []).forEach(function (c) { if (!found) walk(c); });
    })(root);
    return found;
  }

  // annotate parents
  function annotate(node, parent) {
    node.parent = parent;
    (node.children || []).forEach(function (c) { annotate(c, node); });
  }
  function findNodeById(node, id) {
    if (node.id === id) return node;
    var found = null;
    (node.children || []).forEach(function (c) { if (!found) found = findNodeById(c, id); });
    return found;
  }
  // In-place tree refresh: avoids location.reload() which exits fullscreen
  function reloadTree(keepId) {
    fetch('/mindmap/data').then(function (r) { return r.json(); }).then(function (res) {
      data = res.tree;
      root.children = data;
      annotate(root, null);
      selected = (keepId ? findNodeById(root, keepId) : null) || root;
      render();
      refreshPanel();
    });
  }
  annotate(root, null);

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function stripTags(s) { return String(s || '').replace(/<[^>]+>/g, ''); }

  // ---- custom confirm dialog (native confirm is suppressed in fullscreen) ----
  function mmConfirm(message) {
    return new Promise(function (resolve) {
      var overlay = document.createElement('div');
      overlay.className = 'mm-confirm';
      var box = document.createElement('div');
      box.className = 'mm-confirm-box';
      var p = document.createElement('p');
      p.textContent = message;
      var actions = document.createElement('div');
      actions.className = 'mm-confirm-actions';
      var cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'mm-btn';
      cancel.textContent = '取消';
      var ok = document.createElement('button');
      ok.type = 'button';
      ok.className = 'mm-btn danger';
      ok.textContent = '确定';
      actions.appendChild(cancel);
      actions.appendChild(ok);
      box.appendChild(p);
      box.appendChild(actions);
      overlay.appendChild(box);
      function close(val) {
        document.removeEventListener('keydown', onKey, true);
        overlay.remove();
        resolve(val);
      }
      function onKey(ev) {
        ev.stopPropagation();
        if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
        if (ev.key === 'Enter') { ev.preventDefault(); close(true); }
      }
      overlay.addEventListener('mousedown', function (ev) { if (ev.target === overlay) close(false); });
      cancel.addEventListener('click', function () { close(false); });
      ok.addEventListener('click', function () { close(true); });
      document.addEventListener('keydown', onKey, true);
      document.getElementById('mm-page').appendChild(overlay);
      ok.focus();
    });
  }
  function mmAlert(message) {
    return new Promise(function (resolve) {
      var overlay = document.createElement('div');
      overlay.className = 'mm-confirm';
      var box = document.createElement('div');
      box.className = 'mm-confirm-box';
      var p = document.createElement('p');
      p.textContent = message;
      var actions = document.createElement('div');
      actions.className = 'mm-confirm-actions';
      var ok = document.createElement('button');
      ok.type = 'button';
      ok.className = 'mm-btn';
      ok.textContent = '知道了';
      actions.appendChild(ok);
      box.appendChild(p);
      box.appendChild(actions);
      overlay.appendChild(box);
      function close() {
        document.removeEventListener('keydown', onKey, true);
        overlay.remove();
        resolve();
      }
      function onKey(ev) {
        ev.stopPropagation();
        if (ev.key === 'Escape' || ev.key === 'Enter') { ev.preventDefault(); close(); }
      }
      overlay.addEventListener('mousedown', function (ev) { if (ev.target === overlay) close(); });
      ok.addEventListener('click', close);
      document.addEventListener('keydown', onKey, true);
      document.getElementById('mm-page').appendChild(overlay);
      ok.focus();
    });
  }

  // ---- selection & full edit panel ----
  function select(node) {
    if (selected && selected.__el) {
      var r = selected.__el.querySelector('rect');
      selected.__el.classList.remove('selected');
      r.setAttribute('stroke', PRIORITY_STROKE[selected.priority] || '#238363');
      r.setAttribute('stroke-width', 1.2);
    }
    selected = node;
    if (node && node.__el) {
      var r2 = node.__el.querySelector('rect');
      node.__el.classList.add('selected');
      r2.setAttribute('stroke', '#238363');
      r2.setAttribute('stroke-width', 2.5);
    }
    refreshPanel();
  }

  function refreshPanel() {
    if (!selected || selected.root) {
      panel.innerHTML = '<h2>任务导图</h2><p class="muted">这是虚拟根节点。点击右上「＋ 子节点」或在画布选中节点后按 Tab 创建第一个任务；单击任意节点，在右侧编辑它的一切。</p>';
      return;
    }
    var node = selected;
    var linkedNoteIds = node.notes.map(function (n) { return n.id; });
    var linkedAttIds = node.attachments.map(function (a) { return a.id; });
    var noteOptions = window.__allNotes.filter(function (n) { return linkedNoteIds.indexOf(n.id) < 0; })
      .map(function (n) { return '<option value="' + n.id + '">' + esc(n.title) + '</option>'; }).join('');
    var attOptions = window.__allAttachments.filter(function (a) { return linkedAttIds.indexOf(a.id) < 0; })
      .map(function (a) { return '<option value="' + a.id + '">' + esc(a.name) + '</option>'; }).join('');
    var html = '';
    html += '<div class="panel-head"><span class="status-label ' + node.status + '">' + (node.status === 'done' ? '已完成' : (node.status === 'doing' ? '进行中' : '待处理')) + '</span><h2>' + esc(node.title) + '</h2></div>';
    html += '<button class="mm-btn panel-btn" data-panel="done">' + (node.status === 'done' ? '↺ 标记为待处理' : '✓ 标记为已完成') + '</button>';
    html += '<h3>编辑任务</h3>';
    html += '<form id="mm-edit-form">';
    html += '<label>标题<input name="title" value="' + esc(node.title) + '" required></label>';
    html += '<label>状态<select name="status">' + ['todo', 'doing', 'done'].map(function (s) { return '<option value="' + s + '"' + (node.status === s ? ' selected' : '') + '>' + { todo: '待处理', doing: '进行中', done: '已完成' }[s] + '</option>'; }).join('') + '</select></label>';
    html += '<label>优先级<select name="priority">' + ['high', 'medium', 'low'].map(function (p) { return '<option value="' + p + '"' + (node.priority === p ? ' selected' : '') + '>' + { high: '高优先级', medium: '普通', low: '低优先级' }[p] + '</option>'; }).join('') + '</select></label>';
    html += '<label>截止日期<input type="date" name="due_date" value="' + esc(node.due_date || '') + '"></label>';
    html += '<label>经办人<select name="assignee_id"><option value="">未指定</option>' + window.__allAssignees.map(function (a) { return '<option value="' + a.id + '"' + (String(node.assignee_id || '') === String(a.id) ? ' selected' : '') + '>' + esc(a.name) + '</option>'; }).join('') + '</select></label>';
    html += '<label>新增经办人<input type="text" name="new_assignee_name" value="" placeholder="输入姓名并保存到预设"></label>';
    html += '<label>描述<textarea name="description" rows="3" placeholder="任务描述...">' + esc(stripTags(node.description)) + '</textarea></label>';
    html += '<button type="submit" class="button primary small">保存修改</button></form>';
    html += '<h3>关联笔记 (' + node.notes.length + ')</h3>';
    node.notes.forEach(function (n) {
      html += '<div class="panel-item"><a href="/notes/' + n.id + '" target="_blank">▤ ' + esc(n.title) + '</a><button class="icon-button" data-panel="unlink-note" data-id="' + n.id + '" title="解除关联">✕</button></div>';
    });
    html += '<button type="button" class="mm-btn panel-btn link-toggle" data-link-toggle="note">＋ 关联笔记</button>';
    html += '<div class="link-collapsible" data-link-area="note" hidden>';
    html += noteOptions ? '<form id="mm-link-note" class="panel-form"><select name="item_id">' + noteOptions + '</select><button type="submit" class="button ghost small">关联</button></form>' : '<p class="muted small">没有更多可关联的笔记。</p>';
    html += '</div>';
    html += '<h3>关联附件 (' + node.attachments.length + ')</h3>';
    node.attachments.forEach(function (a) {
      html += '<div class="panel-item"><a href="/attachments/' + a.id + '" target="_blank">⌑ ' + esc(a.name) + '</a><button class="icon-button" data-panel="unlink-att" data-id="' + a.id + '" title="解除关联">✕</button></div>';
    });
    html += '<button type="button" class="mm-btn panel-btn link-toggle" data-link-toggle="attachment">＋ 关联附件</button>';
    html += '<div class="link-collapsible" data-link-area="attachment" hidden>';
    html += attOptions ? '<form id="mm-link-att" class="panel-form"><select name="item_id">' + attOptions + '</select><button type="submit" class="button ghost small">关联</button></form>' : '<p class="muted small">没有更多可关联的附件。</p>';
    html += '</div>';
    html += '<h3>危险操作</h3>';
    html += '<button class="button danger small" data-panel="delete-node">－ 仅删此节点（子级提升）</button> ';
    html += '<button class="button danger small" data-panel="delete-tree">✕ 删除节点及子树</button>';
    panel.innerHTML = html;
    panel.scrollTop = 0;

    var form = panel.querySelector('#mm-edit-form');
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var fd = new FormData(form);
      var payload = {};
      ['title', 'status', 'priority', 'due_date', 'description', 'assignee_id', 'new_assignee_name'].forEach(function (k) { payload[k] = fd.get(k); });
      fetch('/mindmap/tasks/' + node.id + '/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(function () { reloadTree(node.id); });
    });
    var linkNote = panel.querySelector('#mm-link-note');
    if (linkNote) linkNote.addEventListener('submit', function (ev) {
      ev.preventDefault();
      fetch('/mindmap/tasks/' + node.id + '/link', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'note', item_id: Number(new FormData(linkNote).get('item_id')) }) })
        .then(function () { reloadTree(node.id); });
    });
    var linkAtt = panel.querySelector('#mm-link-att');
    if (linkAtt) linkAtt.addEventListener('submit', function (ev) {
      ev.preventDefault();
      fetch('/mindmap/tasks/' + node.id + '/link', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'attachment', item_id: Number(new FormData(linkAtt).get('item_id')) }) })
        .then(function () { reloadTree(node.id); });
    });
    panel.querySelectorAll('[data-link-toggle]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var area = panel.querySelector('[data-link-area="' + btn.dataset.linkToggle + '"]');
        if (!area) return;
        area.hidden = !area.hidden;
        var open = !area.hidden;
        btn.textContent = (open ? '－ 收起' : '＋ ') + (btn.dataset.linkToggle === 'note' ? '关联笔记' : '关联附件');
        if (open) {
          var sel = area.querySelector('select');
          if (sel) { sel.focus(); }
        }
      });
    });
    panel.querySelectorAll('[data-panel]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var action = btn.dataset.panel;
        if (action === 'done') {
          fetch('/tasks/' + node.id + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: node.status === 'done' ? 'todo' : 'done', next: '/mindmap' }) })
            .then(function () { reloadTree(node.id); });
        }
        if (action === 'unlink-note' || action === 'unlink-att') {
          fetch('/mindmap/tasks/' + node.id + '/unlink', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: action === 'unlink-note' ? 'note' : 'attachment', item_id: Number(btn.dataset.id) }) })
            .then(function () { reloadTree(node.id); });
        }
        if (action === 'delete-node') {
          mmConfirm('仅删除该节点，子节点将提升一级，确定吗？').then(function (ok) {
            if (ok) fetch('/mindmap/tasks/' + node.id + '/delete-node', { method: 'POST' }).then(function () { reloadTree(node.parent && !node.parent.root ? node.parent.id : null); });
          });
        }
        if (action === 'delete-tree') {
          mmConfirm('确定删除该节点及其所有子节点、笔记和附件吗？').then(function (ok) {
            if (ok) fetch('/tasks/' + node.id + '/delete', { method: 'POST', body: new URLSearchParams({ next: '/mindmap' }) }).then(function () { reloadTree(node.parent && !node.parent.root ? node.parent.id : null); });
          });
        }
      });
    });
  }

  // ---- render with view transform ----
  function applyView() {
    svg.style.transform = 'translate(' + view.x + 'px, ' + view.y + 'px) scale(' + view.k + ')';
    document.getElementById('mm-zoom-label').textContent = Math.round(view.k * 100) + '%';
  }
  function render() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    measure(root);
    assign(root, PAD, Math.max(root.subH / 2 + PAD, PAD));
    var width = 0, height = 0;
    (function bounds(node) {
      width = Math.max(width, node.x + node.w);
      height = Math.max(height, node.y + NH / 2);
      (node.children || []).forEach(bounds);
    })(root);
    var W = width + PAD, H = height + PAD;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    var gAll = el('g', {});
    svg.appendChild(gAll);
    (function drawAll(node) {
      if (node.parent) {
        var x1 = node.parent.x + node.parent.w, y1 = node.parent.y, x2 = node.x, y2 = node.y, mx = (x1 + x2) / 2;
        gAll.appendChild(el('path', { d: 'M' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2, fill: 'none', stroke: '#b8c6c0', 'stroke-width': 1.6 }));
      }
      var g = el('g', { class: 'map-node' + (node === selected ? ' selected' : '') + (node === root ? ' root-node' : ''), transform: 'translate(' + node.x + ',' + (node.y - NH / 2) + ')' });
      g.__node = node;
      node.__el = g;
      g.appendChild(el('rect', { width: node.w, height: NH, rx: 9, fill: nodeFill(node), stroke: node === selected ? '#238363' : (PRIORITY_STROKE[node.priority] || '#238363'), 'stroke-width': node === selected ? 2.5 : 1.2 }));
      var badges = nodeBadges(node);
      var badgeStr = badges.join(' ');
      var avail = node.w - 24 - (badges.length ? badgeStr.length * 6 + 14 : 0);
      var label = node.title;
      if (textWidth(label) > avail) {
        while (label.length && textWidth(label + '…') > avail) label = label.slice(0, -1);
        label += '…';
      }
      var t = el('text', { x: 12, y: NH / 2 + 5, fill: nodeColor(node), 'font-size': 13, 'font-weight': node.root ? 700 : 500 });
      t.textContent = label;
      g.appendChild(t);
      if (badges.length) g.appendChild(el('text', { x: node.w - 8, y: NH / 2 + 4, fill: '#7d8786', 'font-size': 10, 'text-anchor': 'end' }, badgeStr));
      gAll.appendChild(g);
      (node.children || []).forEach(drawAll);
    })(root);
    applyView();
  }

  // ---- canvas pan & zoom ----
  document.addEventListener('mousemove', function (ev) {
    if (!panState) return;
    var dx = ev.clientX - panState.x, dy = ev.clientY - panState.y;
    if (!panState.moved && Math.abs(dx) + Math.abs(dy) > 3) panState.moved = true;
    if (!panState.moved) return;
    view.x = panState.vx + dx;
    view.y = panState.vy + dy;
    applyView();
  });
  document.addEventListener('mouseup', function () {
    if (panState) {
      if (panState.moved) { suppressClick = true; setTimeout(function () { suppressClick = false; }, 0); }
      panState = null;
    }
  });
  wrap.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    zoom(ev.deltaY < 0 ? 1.1 : 0.9, ev);
  }, { passive: false });

  function zoom(factor, ev) {
    var oldK = view.k;
    var newK = Math.min(2.5, Math.max(0.3, oldK * factor));
    if (newK === oldK) return;
    // keep the point under the cursor (or wrap center) fixed while zooming
    var rect = wrap.getBoundingClientRect();
    var mx = ev ? ev.clientX - rect.left : rect.width / 2;
    var my = ev ? ev.clientY - rect.top : rect.height / 2;
    var cx = (mx - view.x) / oldK, cy = (my - view.y) / oldK;
    view.x = mx - cx * newK;
    view.y = my - cy * newK;
    view.k = newK;
    applyView();
  }
  function zoomFit() {
    var W = svg.viewBox.baseVal.width, H = svg.viewBox.baseVal.height;
    var k = Math.min(wrap.clientWidth / W, wrap.clientHeight / H, 1);
    view.k = k;
    view.x = (wrap.clientWidth - W * k) / 2;
    view.y = (wrap.clientHeight - H * k) / 2;
    applyView();
  }

  // ---- fullscreen ----
  var mmPage = document.getElementById('mm-page');
  function toggleFullscreen() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (mmPage.requestFullscreen) { mmPage.requestFullscreen(); }
  }
  document.addEventListener('fullscreenchange', function () {
    mmPage.classList.toggle('is-fullscreen', !!document.fullscreenElement);
  });

  // ---- toolbar actions ----
  document.querySelectorAll('.mm-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var action = btn.dataset.mmAction;
      if (action === 'fullscreen') { toggleFullscreen(); return; }
      if (['zoom-in', 'zoom-out', 'zoom-fit', 'center'].indexOf(action) >= 0) {
        if (action === 'zoom-in') zoom(1.2);
        if (action === 'zoom-out') zoom(1 / 1.2);
        if (action === 'zoom-fit') zoomFit();
        if (action === 'center') { view.x = 0; view.y = 0; render(); }
        return;
      }
      if (!selected || selected.root) { mmAlert('请先点击选择一个节点'); return; }
      if (action === 'child') { createChild(selected); }
      if (action === 'sibling') { createSibling(selected); }
      if (action === 'delete-node') {
        mmConfirm('仅删除该节点，子节点将提升一级，确定吗？').then(function (ok) {
          if (ok) fetch('/mindmap/tasks/' + selected.id + '/delete-node', { method: 'POST' }).then(function () { reloadTree(selected.parent && !selected.parent.root ? selected.parent.id : null); });
        });
      }
      if (action === 'delete-tree') {
        mmConfirm('确定删除该节点及其所有子节点、笔记和附件吗？').then(function (ok) {
          if (ok) fetch('/tasks/' + selected.id + '/delete', { method: 'POST', body: new URLSearchParams({ next: '/mindmap' }) }).then(function () { reloadTree(selected.parent && !selected.parent.root ? selected.parent.id : null); });
        });
      }
      if (action === 'done') {
        fetch('/tasks/' + selected.id + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: selected.status === 'done' ? 'todo' : 'done', next: '/mindmap' }) })
          .then(function () { reloadTree(selected.id); });
      }
    });
  });

  function createChild(node) {
    var parentId = node.root ? '' : node.id;
    var title = node.root ? '新任务' : '新节点';
    fetch('/mindmap/tasks/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: title, parent_id: parentId }) })
      .then(function (r) { return r.json(); }).then(function (res) { reloadTree(res.id); });
  }
  function createSibling(node) {
    if (node.root || !node.parent) { mmAlert('根任务请使用"子节点"按钮创建'); return; }
    fetch('/mindmap/tasks/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: '新节点', parent_id: node.parent.id }) })
      .then(function (r) { return r.json(); }).then(function (res) { reloadTree(res.id); });
  }

  // ---- keyboard shortcuts ----
  document.addEventListener('keydown', function (ev) {
    if (editing) return;
    if (ev.target.matches('input, textarea, select')) return;
    var key = ev.key;
    if (key === 'Tab') {
      ev.preventDefault();
      if (selected) createChild(selected);
    } else if (key === 'Enter') {
      ev.preventDefault();
      if (selected) createSibling(selected);
    } else if (key === 'F11' || ((ev.ctrlKey || ev.metaKey) && ev.shiftKey && key.toLowerCase() === 'f')) {
      ev.preventDefault(); toggleFullscreen();
    } else if (key === 'Delete' || key === 'Backspace') {
      if (selected && !selected.root) {
        ev.preventDefault();
        mmConfirm('删除该节点（子节点提升一级）？').then(function (ok) {
          if (ok) fetch('/mindmap/tasks/' + selected.id + '/delete-node', { method: 'POST' }).then(function () { reloadTree(selected.parent && !selected.parent.root ? selected.parent.id : null); });
        });
      }
    } else if ((ev.ctrlKey || ev.metaKey) && (key === '=' || key === '+')) {
      ev.preventDefault(); zoom(1.2);
    } else if ((ev.ctrlKey || ev.metaKey) && key === '-') {
      ev.preventDefault(); zoom(1 / 1.2);
    }
  });

  render();
  select(root);
})();
</script>
<script>
window.__allNotes = [{% for note in notes %}{id: {{ note.id }}, title: {{ note.title|tojson }} }{{ ',' if not loop.last }}{% endfor %}];
window.__allAttachments = [{% for file in attachments %}{id: {{ file.id }}, name: {{ file.original_name|tojson }} }{{ ',' if not loop.last }}{% endfor %}];
window.__allAssignees = [{% for assignee in assignees %}{id: {{ assignee.id }}, name: {{ assignee.name|tojson }} }{{ ',' if not loop.last }}{% endfor %}];
</script>
{% endblock %}
