{% extends 'base.html' %}
{% block title %}任务导图{% endblock %}
{% block content %}
<div class="mindmap-page">
<div class="mm-toolbar">
  <span class="mm-brand">◈ 任务导图</span>
  <span class="mm-sep"></span>
  <button class="mm-btn" data-mm-action="child" title="添加子节点 (Tab)">＋ 子节点</button>
  <button class="mm-btn" data-mm-action="sibling" title="添加同级节点 (Enter)">＋ 同级</button>
  <button class="mm-btn" data-mm-action="delete-node" title="删除当前节点（保留子节点）">－ 删节点</button>
  <button class="mm-btn" data-mm-action="delete-tree" title="删除节点及全部子节点">✕ 删子树</button>
  <span class="mm-sep"></span>
  <button class="mm-btn" data-mm-action="done" title="切换完成状态">✓ 完成</button>
  <button class="mm-btn" data-mm-action="detail" title="打开任务详情">详情 →</button>
  <span class="mm-flex"></span>
  <span class="mm-zoom-label" id="mm-zoom-label">100%</span>
  <button class="mm-btn" data-mm-action="zoom-out" title="缩小 (Ctrl -)">－</button>
  <button class="mm-btn" data-mm-action="zoom-in" title="放大 (Ctrl +)">＋</button>
  <button class="mm-btn" data-mm-action="zoom-fit" title="适应画布">最适合</button>
  <button class="mm-btn" data-mm-action="center" title="回到中心">⌂</button>
</div>
<div class="mindmap-layout mm-full">
  <div class="map-canvas-wrap" id="mm-canvas-wrap">
    <svg id="map-canvas"></svg>
    <div class="mm-hint">双击节点编辑 · Tab 加子节点 · Enter 加同级 · Delete 删除 · 拖拽节点调整结构 · 空白处拖动画布 · 滚轮缩放</div>
  </div>
</div>
</div>
<script type="application/json" id="tree-data">{{ tree|tojson }}</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('tree-data').textContent);
  var NW = 180, NH = 42, HGAP = 76, VGAP = 14, PAD = 40;
  var root = { id: 0, title: '任务', root: true, status: 'root', priority: 'medium', due_date: '', description: '', notes: [], attachments: [], children: data };
  var wrap = document.getElementById('mm-canvas-wrap');
  var svg = document.getElementById('map-canvas');
  var NS = 'http://www.w3.org/2000/svg';
  var selected = null, editing = null;
  var view = { x: 0, y: 0, k: 1 };

  function measure(node) {
    if (!node.children || !node.children.length) { node.subH = NH; return; }
    var total = 0;
    node.children.forEach(function (c) { measure(c); total += c.subH; });
    total += VGAP * (node.children.length - 1);
    node.subH = Math.max(NH, total);
  }
  function assign(node, x, y) {
    node.x = x; node.y = y;
    if (!node.children || !node.children.length) return;
    var childX = x + NW + HGAP;
    var cursor = y - node.subH / 2;
    node.children.forEach(function (c) {
      assign(c, childX, cursor + c.subH / 2);
      cursor += c.subH + VGAP;
    });
  }
  function el(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function nodeFill(n) {
    if (n.root) return '#263638';
    if (n.status === 'done') return '#e4ebe6';
    return { high: '#fde8df', medium: '#dcefe5', low: '#f2f4f1' }[n.priority] || '#dcefe5';
  }
  function nodeColor(n) {
    if (n.root) return '#fff';
    if (n.status === 'done') return '#9aa8a0';
    return { high: '#c65d4d', medium: '#238363', low: '#7d8786' }[n.priority] || '#238363';
  }

  function draw(node) {
    if (node.parent) {
      var x1 = node.parent.x + NW, y1 = node.parent.y, x2 = node.x, y2 = node.y, mx = (x1 + x2) / 2;
      svg.appendChild(el('path', { d: 'M' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2, fill: 'none', stroke: '#b8c6c0', 'stroke-width': 1.6 }));
    }
    var g = el('g', { class: 'map-node' + (node === selected ? ' selected' : ''), transform: 'translate(' + node.x + ',' + (node.y - NH / 2) + ')' });
    g.appendChild(el('rect', { width: NW, height: NH, rx: 9, fill: nodeFill(node), stroke: node === selected ? '#238363' : 'transparent', 'stroke-width': 2 }));
    var label = node.title.length > 11 ? node.title.slice(0, 11) + '…' : node.title;
    var t = el('text', { x: 12, y: NH / 2 + 5, fill: nodeColor(node), 'font-size': 13, 'font-weight': node.root ? 700 : 500 });
    t.textContent = label;
    g.appendChild(t);
    var badges = [];
    if (node.notes.length) badges.push('▤' + node.notes.length);
    if (node.attachments.length) badges.push('⌑' + node.attachments.length);
    if (node.children.length) badges.push('＋' + node.children.length);
    if (badges.length) g.appendChild(el('text', { x: NW - 8, y: NH / 2 + 4, fill: '#7d8786', 'font-size': 10, 'text-anchor': 'end' }, badges.join(' ')));
    g.addEventListener('click', function (ev) { ev.stopPropagation(); if (dragState.moved) return; select(node); });
    g.addEventListener('dblclick', function (ev) { ev.stopPropagation(); startEdit(node); });
    enableNodeDrag(g, node);
    svg.appendChild(g);
    (node.children || []).forEach(draw);
  }

  // ---- inline edit (MindNow style) ----
  function startEdit(node) {
    if (node.root || editing) return;
    editing = node;
    var fo = el('foreignObject', { x: node.x, y: node.y - NH / 2, width: NW, height: NH });
    var input = document.createElement('input');
    input.value = node.title;
    input.className = 'mm-edit-input';
    fo.appendChild(input);
    svg.appendChild(fo);
    input.focus(); input.select();
    function commit(save) {
      if (!editing) return;
      var val = input.value.trim();
      editing = null;
      if (save && val) {
        post('/mindmap/tasks/' + node.id + '/rename', { title: val });
      } else { render(); }
    }
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); commit(true); }
      if (ev.key === 'Escape') { ev.preventDefault(); commit(false); }
    });
    input.addEventListener('blur', function () { commit(true); });
  }

  function post(url, data) {
    var fd = new FormData();
    Object.keys(data || {}).forEach(function (k) { fd.append(k, data[k]); });
    fetch(url, { method: 'POST', body: fd }).then(function (r) { if (!r.ok) throw 0; return r.json ? r : r; }).then(function () { location.reload(); }).catch(function () { location.reload(); });
  }

  // ---- node drag to re-parent (MindNow style) ----
  var dragState = { dragging: null, moved: false, ghost: null };

  function enableNodeDrag(g, node) {
    if (node.root) return;
    g.addEventListener('mousedown', function (ev) {
      if (ev.button !== 0 || editing) return;
      dragState.dragging = node; dragState.moved = false;
      dragState.startX = ev.clientX; dragState.startY = ev.clientY;
      ev.preventDefault();
    });
  }

  document.addEventListener('mousemove', function (ev) {
    if (!dragState.dragging) return;
    var dx = ev.clientX - dragState.startX, dy = ev.clientY - dragState.startY;
    if (!dragState.moved && Math.abs(dx) + Math.abs(dy) > 5) {
      dragState.moved = true;
      var n = dragState.dragging;
      dragState.ghost = el('rect', { width: NW, height: NH, rx: 9, fill: 'rgba(35,131,99,.15)', stroke: '#238363', 'stroke-dasharray': '4 3', x: n.x + dx / view.k, y: n.y - NH / 2 + dy / view.k });
      svg.appendChild(dragState.ghost);
    }
    if (dragState.moved && dragState.ghost) {
      dragState.ghost.setAttribute('x', dragState.dragging.x + dx / view.k);
      dragState.ghost.setAttribute('y', dragState.dragging.y - NH / 2 + dy / view.k);
      document.querySelectorAll('.map-node').forEach(function (gEl) { gEl.classList.remove('drop-hint'); });
      var target = nodeAt(dragState.dragging.x + dx / view.k, dragState.dragging.y + dy / view.k, dragState.dragging);
      if (target) highlightNode(target);
    }
  });

  document.addEventListener('mouseup', function (ev) {
    if (!dragState.dragging) return;
    var node = dragState.dragging;
    var dx = ev.clientX - dragState.startX, dy = ev.clientY - dragState.startY;
    var moved = dragState.moved;
    if (dragState.ghost) { svg.removeChild(dragState.ghost); dragState.ghost = null; }
    document.querySelectorAll('.map-node').forEach(function (g) { g.classList.remove('drop-hint'); });
    dragState.dragging = null;
    if (moved) {
      var target = nodeAt(node.x + dx / view.k, node.y + dy / view.k, node);
      if (target && target !== node) {
        fetch('/mindmap/tasks/' + node.id + '/move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ parent_id: target.id }) })
          .then(function (r) { return r.json(); }).then(function (res) { if (res.error) alert(res.error); location.reload(); });
        return;
      }
      render();
    }
  });

  function highlightNode(target) {
    document.querySelectorAll('.map-node').forEach(function (g) {
      var t = g.__node;
      if (t === target) g.classList.add('drop-hint');
    });
  }

  function nodeAt(x, y, exclude) {
    var found = null;
    (function walk(n) {
      if (n !== exclude && !n.root) {
        if (x >= n.x && x <= n.x + NW && y >= n.y - NH / 2 && y <= n.y + NH / 2) { found = n; return; }
      }
      (n.children || []).forEach(function (c) { if (!found) walk(c); });
    })(root);
    return found;
  }

  function findByTree(node, id) {
    if (node.id === id) return node;
    for (var i = 0; i < (node.children || []).length; i++) {
      var f = findByTree(node.children[i], id);
      if (f) return f;
    }
    return null;
  }

  // annotate parents & store refs
  (function annotate(node, parent) {
    node.parent = parent;
    (node.children || []).forEach(function (c) { annotate(c, node); });
  })(root, null);

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  // ---- selection panel (context) ----
  function select(node) {
    selected = node;
    render();
    if (node.root) return;
    wrap.dataset.selectedId = node.id;
  }

  // ---- render with view transform ----
  function render() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    measure(root);
    assign(root, PAD, Math.max(root.subH / 2 + PAD, PAD));
    var width = 0, height = 0;
    (function bounds(node) {
      width = Math.max(width, node.x + NW);
      height = Math.max(height, node.y + NH / 2);
      (node.children || []).forEach(bounds);
    })(root);
    var W = width + PAD, H = height + PAD;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.style.height = Math.max(H, 320) + 'px';
    var gAll = el('g', { transform: 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')' });
    svg.appendChild(gAll);
    // draw into gAll
    (function drawAll(node) {
      if (node.parent) {
        var x1 = node.parent.x + NW, y1 = node.parent.y, x2 = node.x, y2 = node.y, mx = (x1 + x2) / 2;
        gAll.appendChild(el('path', { d: 'M' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2, fill: 'none', stroke: '#b8c6c0', 'stroke-width': 1.6 }));
      }
      var g = el('g', { class: 'map-node' + (node === selected ? ' selected' : '') + (node === root ? ' root-node' : ''), transform: 'translate(' + node.x + ',' + (node.y - NH / 2) + ')' });
      g.__node = node;
      g.appendChild(el('rect', { width: NW, height: NH, rx: 9, fill: nodeFill(node), stroke: node === selected ? '#238363' : 'transparent', 'stroke-width': 2 }));
      var label = node.title.length > 11 ? node.title.slice(0, 11) + '…' : node.title;
      var t = el('text', { x: 12, y: NH / 2 + 5, fill: nodeColor(node), 'font-size': 13, 'font-weight': node.root ? 700 : 500 });
      t.textContent = label;
      g.appendChild(t);
      var badges = [];
      if (node.notes.length) badges.push('▤' + node.notes.length);
      if (node.attachments.length) badges.push('⌑' + node.attachments.length);
      if (node.children.length) badges.push('＋' + node.children.length);
      if (badges.length) g.appendChild(el('text', { x: NW - 8, y: NH / 2 + 4, fill: '#7d8786', 'font-size': 10, 'text-anchor': 'end' }, badges.join(' ')));
      g.addEventListener('click', function (ev) { ev.stopPropagation(); if (dragState.moved) return; select(node); });
      g.addEventListener('dblclick', function (ev) { ev.stopPropagation(); startEdit(node); });
      enableNodeDrag(g, node);
      gAll.appendChild(g);
      (node.children || []).forEach(drawAll);
    })(root);
    document.getElementById('mm-zoom-label').textContent = Math.round(view.k * 100) + '%';
  }

  // ---- canvas pan & zoom ----
  var panState = null;
  wrap.addEventListener('mousedown', function (ev) {
    if (ev.target.closest('.map-node') || editing) return;
    panState = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y };
  });
  document.addEventListener('mousemove', function (ev) {
    if (!panState) return;
    view.x = panState.vx + (ev.clientX - panState.x);
    view.y = panState.vy + (ev.clientY - panState.y);
    render();
  });
  document.addEventListener('mouseup', function () { panState = null; });
  wrap.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    zoom(ev.deltaY < 0 ? 1.1 : 0.9);
  }, { passive: false });

  function zoom(factor) {
    view.k = Math.min(2.5, Math.max(0.3, view.k * factor));
    render();
  }

  // ---- toolbar actions ----
  document.querySelectorAll('.mm-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var action = btn.dataset.mmAction;
      if (['zoom-in', 'zoom-out', 'zoom-fit', 'center'].indexOf(action) >= 0) {
        if (action === 'zoom-in') zoom(1.2);
        if (action === 'zoom-out') zoom(1 / 1.2);
        if (action === 'zoom-fit') { view.k = 1; view.x = 0; view.y = 0; render(); }
        if (action === 'center') { view.x = 0; view.y = 0; render(); }
        return;
      }
      if (!selected || selected.root) { alert('请先点击选择一个节点'); return; }
      if (action === 'child') { createChild(selected); }
      if (action === 'sibling') { createSibling(selected); }
      if (action === 'delete-node') {
        if (confirm('仅删除该节点，子节点将提升一级，确定吗？')) post('/mindmap/tasks/' + selected.id + '/delete-node', {});
      }
      if (action === 'delete-tree') {
        if (confirm('确定删除该节点及其所有子节点、笔记和附件吗？')) post('/tasks/' + selected.id + '/delete', { next: '/mindmap' });
      }
      if (action === 'done') {
        post('/tasks/' + selected.id + '/status', { status: selected.status === 'done' ? 'todo' : 'done', next: '/mindmap' });
      }
      if (action === 'detail') { location.href = '/tasks/' + selected.id; }
    });
  });

  function createChild(node) {
    if (node.root) {
      post('/mindmap/tasks/create', { title: '新任务', parent_id: '' });
    } else {
      fetch('/mindmap/tasks/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: '新节点', parent_id: node.id }) })
        .then(function (r) { return r.json(); }).then(function () { location.reload(); });
    }
  }
  function createSibling(node) {
    if (node.root || !node.parent) { alert('根任务请使用"子节点"按钮创建'); return; }
    fetch('/mindmap/tasks/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: '新节点', parent_id: node.parent.id }) })
      .then(function (r) { return r.json(); }).then(function () { location.reload(); });
  }

  // ---- keyboard shortcuts (MindNow style) ----
  document.addEventListener('keydown', function (ev) {
    if (editing) return;
    if (ev.target.matches('input, textarea, select')) return;
    var key = ev.key;
    if (key === 'Tab') {
      ev.preventDefault();
      if (selected) createChild(selected);
    } else if (key === 'Enter') {
      ev.preventDefault();
      if (selected) createSibling(selected);
    } else if (key === 'Delete' || key === 'Backspace') {
      if (selected && !selected.root) {
        ev.preventDefault();
        if (confirm('删除该节点（子节点提升一级）？')) post('/mindmap/tasks/' + selected.id + '/delete-node', {});
      }
    } else if ((ev.ctrlKey || ev.metaKey) && (key === '=' || key === '+')) {
      ev.preventDefault(); zoom(1.2);
    } else if ((ev.ctrlKey || ev.metaKey) && key === '-') {
      ev.preventDefault(); zoom(1 / 1.2);
    }
  });

  svg.addEventListener('click', function () { select(root); });
  render();
  select(root);
})();
</script>
<script>
window.__allNotes = [{% for note in notes %}{id: {{ note.id }}, title: {{ note.title|tojson }} }{{ ',' if not loop.last }}{% endfor %}];
window.__allAttachments = [{% for file in attachments %}{id: {{ file.id }}, name: {{ file.original_name|tojson }} }{{ ',' if not loop.last }}{% endfor %}];
</script>
{% endblock %}
