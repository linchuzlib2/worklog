{% extends 'base.html' %}{% block title %}{{ '编辑任务' if task else '新任务' }}{% endblock %}{% block head %}<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">{% endblock %}{% block content %}<div class="form-page"><a class="back-link" href="{{ url_for('index') }}">← 返回工作台</a><h1>{{ '编辑任务' if task else '创建新任务' }}</h1><p class="subtitle">记录目标，拆掉阻力，开始行动。</p><form method="post" class="editor-form"><label>任务标题<input required name="title" value="{{ task.title if task else '' }}" placeholder="例如：完成本周项目复盘"></label><div class="form-row"><label>状态<select name="status"><option value="todo" {% if not task or task.status == 'todo' %}selected{% endif %}>待处理</option><option value="doing" {% if task and task.status == 'doing' %}selected{% endif %}>进行中</option><option value="done" {% if task and task.status == 'done' %}selected{% endif %}>已完成</option></select></label><label>优先级<select name="priority"><option value="high" {% if task and task.priority == 'high' %}selected{% endif %}>高优先级</option><option value="medium" {% if not task or task.priority == 'medium' %}selected{% endif %}>普通</option><option value="low" {% if task and task.priority == 'low' %}selected{% endif %}>低优先级</option></select></label><label>截止日期<input type="date" name="due_date" value="{{ task.due_date.isoformat() if task and task.due_date else '' }}"></label></div><label>任务描述<div id="editor">{{ task.description|safe if task else '' }}</div><input type="hidden" name="description" id="description"></label><button class="button primary large" type="submit">{{ '保存修改' if task else '创建任务' }}　→</button></form></div>{% endblock %}
