{% extends 'base.html' %}
{% block title %}财务密码登录{% endblock %}
{% block content %}
<section class="page-heading">
  <div>
    <p class="eyebrow">PRIVATE FINANCE</p>
    <h1>{% if module == 'cashflow' %}家庭现金流{% else %}个人记账{% endif %}</h1>
    <p class="subtitle">此模块需要密码登录后查看，密码由你自己设置。</p>
  </div>
</section>

<div class="login-panel">
  <form method="post" action="{{ url_for('finance_login_submit') }}" class="finance-login-form">
    <input type="hidden" name="module" value="{{ module }}">
    <label>密码
      <input type="password" name="password" required placeholder="请输入访问密码">
    </label>
    <button class="button primary" type="submit">登录查看</button>
  </form>
</div>
{% endblock %}
