{% extends 'base.html' %}{% block title %}{{ '编辑笔记' if note else '新笔记' }}{% endblock %}{% block head %}<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">{% endblock %}{% block content %}<div class="form-page"><a class="back-link" href="{{ url_for('index') }}">← 返回工作台</a><h1>{{ '编辑笔记' if note else '写下新笔记' }}</h1><p class="subtitle">捕捉思路，留下上下文。</p><form method="post" class="editor-form"><label>笔记标题<input required name="title" value="{{ note.title if note else '' }}" placeholder="例如：客户访谈要点"></label><label>关联任务<select name="task_id"><option value="">不关联任务</option>{% for task in tasks %}<option value="{{ task.id }}" {% if note and note.task_id == task.id or not note and request.args.get('task_id', type=int) == task.id %}selected{% endif %}>{{ task.title }}</option>{% endfor %}</select></label><label>内容<div id="editor">{{ note.content|safe if note else '' }}</div><input type="hidden" name="content" id="content"></label><button class="button primary large" type="submit">{{ '保存修改' if note else '保存笔记' }}　→</button></form></div>{% endblock %}
