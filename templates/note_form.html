{% extends 'base.html' %}{% block title %}{{ '编辑笔记' if note else '新笔记' }}{% endblock %}{% block head %}<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">{% endblock %}{% block content %}<div class="form-page"><a class="back-link" href="{{ url_for('index') }}">← 返回工作台</a><h1>{{ '编辑笔记' if note else '写下新笔记' }}</h1><p class="subtitle">捕捉思路，留下上下文。</p><form method="post" class="editor-form"><label>笔记标题<input required name="title" value="{{ note.title if note else '' }}" placeholder="例如：客户访谈要点"></label><label>关联任务<select name="task_id"><option value="">不关联任务</option>{% for task in tasks %}<option value="{{ task.id }}" {% if selected_task_id == task.id %}selected{% endif %}>{{ task.title }}</option>{% endfor %}</select></label><label>内容<div id="editor">{{ note.content|safe if note else '' }}</div><input type="hidden" name="content" id="content"></label><div class="polish-row"><button type="button" class="button ghost" id="polish-btn">✦ 智谱 AI 润色</button><span id="polish-status" class="muted small"></span></div><button class="button primary large" type="submit">{{ '保存修改' if note else '保存笔记' }}　→</button></form></div>{% endblock %}{% block scripts %}<script>document.addEventListener('DOMContentLoaded', function () {
  var btn = document.getElementById('polish-btn');
  if (!btn) return;
  var quill = Quill.find(document.querySelector('#editor'));
  var status = document.getElementById('polish-status');
  var noteId = {{ note.id if note else 'null' }};
  btn.addEventListener('click', function () {
    var content = quill.getText().trim();
    if (!content) { status.textContent = '内容为空，先写点什么吧'; return; }
    if (noteId === null && !confirm('润色会替换编辑器中的内容，继续吗？')) return;
    btn.disabled = true; status.textContent = '智谱 AI 润色中…';
    fetch('/notes/' + noteId + '/polish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: quill.root.innerHTML }) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.error) { status.textContent = res.error; return; }
        quill.clipboard.dangerouslyPasteHTML(res.html);
        status.textContent = '已应用润色结果，请检查后保存';
      })
      .catch(function () { status.textContent = '请求失败，请重试'; })
      .finally(function () { btn.disabled = false; });
  });
});</script>{% endblock %}
